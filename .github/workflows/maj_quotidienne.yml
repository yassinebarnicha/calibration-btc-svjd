name: Daily update

# Every morning, just after the Deribit expiry (08:00 UTC): snapshot of the option chain
# -> jours/<date>.js, page rebuilt, commit. GitHub Pages republishes on its own.
on:
  schedule:
    - cron: "20 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maj-quotidienne
  cancel-in-progress: false

jobs:
  instantane:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dependencies
        run: pip install -r requirements.txt
      - name: Deribit snapshot and page rebuild
        working-directory: sources
        run: python aujourdhui.py
      - name: Commit the new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add jours index.html jeux.js
          if git diff --cached --quiet; then
            echo "nothing new"
          else
            git commit -m "Deribit snapshot of $(date -u +%F)"
            git push
          fi
